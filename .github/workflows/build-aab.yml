name: Build NovaBoost AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install apktool
        run: |
          curl -sL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          echo '#!/bin/bash
          java -jar /usr/local/bin/apktool.jar "$@"' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install bundletool
        run: |
          curl -sL https://github.com/google/bundletool/releases/download/1.17.1/bundletool-all-1.17.1.jar -o /usr/local/bin/bundletool.jar
          echo '#!/bin/bash
          java -jar /usr/local/bin/bundletool.jar "$@"' > /usr/local/bin/bundletool
          chmod +x /usr/local/bin/bundletool

      - name: Build APK with apktool
        run: |
          cd app-source
          rm -rf build
          find . -name "*.bak" -delete
          apktool b . -f -o /tmp/NovaBoost_raw.apk --use-aapt2
          echo "APK built successfully"

      - name: Zipalign APK
        run: |
          zipalign -f 4 /tmp/NovaBoost_raw.apk /tmp/NovaBoost_aligned.apk
          echo "APK aligned"

      - name: Sign APK
        run: |
          apksigner sign \
            --ks novaboost_upload.keystore \
            --ks-pass pass:novaboost123 \
            --key-pass pass:novaboost123 \
            --ks-key-alias novaboost-upload \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            /tmp/NovaBoost_aligned.apk
          echo "APK signed"

      - name: Convert APK to proper AAB
        run: |
          # A proper AAB has this exact structure:
          # base/manifest/AndroidManifest.xml
          # base/dex/classes*.dex
          # base/res/ (ALL compiled resources)
          # base/root/ (assets, libs, kotlin, etc)
          # base/resources.arsc
          # BUNDLE-METADATA/ (metadata)

          mkdir -p /tmp/aab
          cd /tmp
          
          # Extract APK
          rm -rf apk-extract
          mkdir -p apk-extract
          unzip -o NovaBoost_aligned.apk -d apk-extract
          
          # Create AAB base directories
          mkdir -p aab/base/manifest
          mkdir -p aab/base/dex
          mkdir -p aab/base/res
          mkdir -p aab/base/root
          mkdir -p aab/BUNDLE-METADATA/MergedManifest
          mkdir -p aab/BUNDLE-METADATA/NativeLibs
          mkdir -p aab/BUNDLE-METADATA/Obfuscation
          mkdir -p aab/BUNDLE-METADATA/ShaderDb
          mkdir -p aab/BUNDLE-METADATA/VersionControlMapping
          
          # Copy AndroidManifest.xml to base/manifest/
          cp apk-extract/AndroidManifest.xml aab/base/manifest/
          
          # Copy ALL resources to base/res/
          cp -r apk-extract/res/* aab/base/res/
          echo "Resources copied: $(find aab/base/res -type f | wc -l) files"
          
          # Copy resources.arsc
          cp apk-extract/resources.arsc aab/base/
          
          # Copy ALL dex files to base/dex/
          for dex in apk-extract/classes*.dex; do
            cp "$dex" aab/base/dex/
          done
          echo "DEX files: $(ls aab/base/dex/*.dex 2>/dev/null | wc -l)"
          
          # Copy assets to base/root/assets/
          if [ -d apk-extract/assets ]; then
            cp -r apk-extract/assets aab/base/root/
            echo "Assets copied"
          fi
          
          # Copy lib to base/lib/
          if [ -d apk-extract/lib ]; then
            cp -r apk-extract/lib aab/base/
            echo "Native libs copied"
          fi
          
          # Copy kotlin to base/root/
          if [ -d apk-extract/kotlin ]; then
            cp -r apk-extract/kotlin aab/base/root/
            echo "Kotlin data copied"
          fi
          
          # Copy other root-level files (not res, dex, manifest, arsc)
          for f in apk-extract/*; do
            fname=$(basename "$f")
            case "$fname" in
              AndroidManifest.xml|resources.arsc|classes*|res|assets|lib|kotlin|META-INF) continue ;;
              *) cp -r "$f" aab/base/root/ 2>/dev/null ;;
            esac
          done
          echo "Root files copied"
          
          # Create BUNDLE-METADATA files
          echo "" > aab/BUNDLE-METADATA/MergedManifest/merged_manifest.pb
          echo "" > aab/BUNDLE-METADATA/NativeLibs/native_libs.pb
          echo "" > aab/BUNDLE-METADATA/Obfuscation/obfuscation.pb
          echo "" > aab/BUNDLE-METADATA/ShaderDb/shader_db.pb
          echo "" > aab/BUNDLE-METADATA/VersionControlMapping/version_control_mapping.pb
          
          # Create the AAB zip (proper compression)
          cd aab
          zip -r -9 /tmp/NovaBoost_unsigned.aab .
          cd /tmp
          
          echo "AAB created: $(ls -la NovaBoost_unsigned.aab)"
          echo "AAB contents:"
          unzip -l NovaBoost_unsigned.aab | head -30

      - name: Verify AAB structure
        run: |
          echo "=== Checking critical files ==="
          unzip -l /tmp/NovaBoost_unsigned.aab | grep "base/manifest/AndroidManifest.xml"
          unzip -l /tmp/NovaBoost_unsigned.aab | grep "base/dex/"
          echo "Resources count:"
          unzip -l /tmp/NovaBoost_unsigned.aab | grep "base/res/" | wc -l
          echo "=== Checking BUNDLE-METADATA ==="
          unzip -l /tmp/NovaBoost_unsigned.aab | grep "BUNDLE-METADATA/"

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore novaboost_upload.keystore \
            -storepass novaboost123 \
            -keypass novaboost123 \
            /tmp/NovaBoost_unsigned.aab novaboost-upload 2>&1 | tail -5
          cp /tmp/NovaBoost_unsigned.aab /tmp/NovaBoost.aab
          echo "AAB signed"
          ls -la /tmp/NovaBoost.aab

      - name: Final verification
        run: |
          echo "=== DEX URL check ==="
          unzip -p /tmp/NovaBoost.aab base/dex/classes.dex | strings | grep "surge"
          echo ""
          echo "=== AAB file type ==="
          file /tmp/NovaBoost.aab
          echo ""
          echo "=== AAB size ==="
          ls -la /tmp/NovaBoost.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-AAB-v2
          path: /tmp/NovaBoost.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-APK-v2
          path: /tmp/NovaBoost_aligned.apk
          retention-days: 30
