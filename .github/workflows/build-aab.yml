name: Build NovaBoost AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set SDK tools path
        run: |
          SDK_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          echo "SDK_TOOLS=$SDK_TOOLS" >> $GITHUB_ENV
          echo "Using build-tools: $SDK_TOOLS"
          echo "$SDK_TOOLS" >> $GITHUB_PATH

      - name: Install apktool
        run: |
          curl -sL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          echo '#!/bin/bash
          java -jar /usr/local/bin/apktool.jar "$@"' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Build APK with apktool
        run: |
          cd app-source
          rm -rf build
          find . -name "*.bak" -delete
          apktool b . -f -o /tmp/NovaBoost_raw.apk --use-aapt2
          echo "APK built: $(ls -la /tmp/NovaBoost_raw.apk)"

      - name: Zipalign and Sign APK
        run: |
          $SDK_TOOLS/zipalign -f 4 /tmp/NovaBoost_raw.apk /tmp/NovaBoost_aligned.apk
          echo "APK aligned"
          
          $SDK_TOOLS/apksigner sign \
            --ks novaboost_upload.keystore \
            --ks-pass pass:novaboost123 \
            --key-pass pass:novaboost123 \
            --ks-key-alias novaboost-upload \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            /tmp/NovaBoost_aligned.apk
          echo "APK signed: $(ls -la /tmp/NovaBoost_aligned.apk)"

      - name: Convert APK to proper AAB
        run: |
          # Clean up
          rm -rf /tmp/aab /tmp/apk-extract
          mkdir -p /tmp/aab
          
          # Extract APK
          mkdir -p /tmp/apk-extract
          unzip -o /tmp/NovaBoost_aligned.apk -d /tmp/apk-extract
          
          # Create AAB directory structure
          mkdir -p /tmp/aab/base/manifest
          mkdir -p /tmp/aab/base/dex
          mkdir -p /tmp/aab/base/res
          mkdir -p /tmp/aab/base/root
          mkdir -p /tmp/aab/BUNDLE-METADATA/MergedManifest
          mkdir -p /tmp/aab/BUNDLE-METADATA/NativeLibs
          mkdir -p /tmp/aab/BUNDLE-METADATA/Obfuscation
          mkdir -p /tmp/aab/BUNDLE-METADATA/ShaderDb
          mkdir -p /tmp/aab/BUNDLE-METADATA/VersionControlMapping
          
          # 1. Copy manifest
          cp /tmp/apk-extract/AndroidManifest.xml /tmp/aab/base/manifest/
          
          # 2. Copy ALL resources
          cp -r /tmp/apk-extract/res/* /tmp/aab/base/res/
          echo "Resources: $(find /tmp/aab/base/res -type f | wc -l) files"
          
          # 3. Copy resources.arsc
          cp /tmp/apk-extract/resources.arsc /tmp/aab/base/
          
          # 4. Copy ALL dex files
          for dex in /tmp/apk-extract/classes*.dex; do
            cp "$dex" /tmp/aab/base/dex/
          done
          echo "DEX files: $(ls /tmp/aab/base/dex/*.dex | wc -l)"
          
          # 5. Copy assets
          if [ -d /tmp/apk-extract/assets ]; then
            cp -r /tmp/apk-extract/assets /tmp/aab/base/root/
            echo "Assets copied: $(find /tmp/aab/base/root/assets -type f | wc -l) files"
          fi
          
          # 6. Copy native libs
          if [ -d /tmp/apk-extract/lib ]; then
            cp -r /tmp/apk-extract/lib /tmp/aab/base/
            echo "Native libs copied"
          fi
          
          # 7. Copy kotlin data
          if [ -d /tmp/apk-extract/kotlin ]; then
            cp -r /tmp/apk-extract/kotlin /tmp/aab/base/root/
            echo "Kotlin data copied"
          fi
          
          # 8. Copy other root files
          for f in /tmp/apk-extract/*; do
            fname=$(basename "$f")
            case "$fname" in
              AndroidManifest.xml|resources.arsc|classes*|res|assets|lib|kotlin|META-INF) continue ;;
              *) cp -r "$f" /tmp/aab/base/root/ 2>/dev/null ;;
            esac
          done
          echo "Root files copied"
          
          # 9. Create BUNDLE-METADATA placeholder files
          touch /tmp/aab/BUNDLE-METADATA/MergedManifest/merged_manifest.pb
          touch /tmp/aab/BUNDLE-METADATA/NativeLibs/native_libs.pb
          touch /tmp/aab/BUNDLE-METADATA/Obfuscation/obfuscation.pb
          touch /tmp/aab/BUNDLE-METADATA/ShaderDb/shader_db.pb
          touch /tmp/aab/BUNDLE-METADATA/VersionControlMapping/version_control_mapping.pb
          
          # 10. Create AAB zip with maximum compression
          cd /tmp/aab
          zip -r -9 /tmp/NovaBoost_unsigned.aab .
          echo "AAB created: $(ls -la /tmp/NovaBoost_unsigned.aab)"
          
          # Verify structure
          echo "=== AAB Structure ==="
          unzip -l /tmp/NovaBoost_unsigned.aab | grep -E "base/manifest|base/dex|base/res/|base/resources|BUNDLE-METADATA" | head -20
          echo "Resource files: $(unzip -l /tmp/NovaBoost_unsigned.aab | grep 'base/res/' | wc -l)"

      - name: Sign AAB
        run: |
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore novaboost_upload.keystore \
            -storepass novaboost123 \
            -keypass novaboost123 \
            /tmp/NovaBoost_unsigned.aab novaboost-upload
          cp /tmp/NovaBoost_unsigned.aab /tmp/NovaBoost.aab
          echo "AAB signed: $(ls -la /tmp/NovaBoost.aab)"


      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "NovaBoost v2.2.0"
          body: |
            ## NovaBoost v2.2.0
            
            ### What's New
            - Removed unused Play Billing Library v7.1.1 (app has no in-app purchases) -
              eliminates the Google Play Billing v8+ deadline issue entirely
            - Removed BILLING permission, billing metadata, and billing manifest entries
            - Fixed crash on VIP button (removed dangling RevenueCat reference)
            - Real ping display using TCP socket timing
            - Real Ultra Boost engine: RAM trimming, DND mode, Game Mode (Android 12+)
            
            ### Notes
            - Zero data collection - no analytics, no tracking
            - Google Play compliant
          files: |
            /tmp/NovaBoost.aab
            /tmp/NovaBoost_aligned.apk
          generate_release_notes: false
          make_latest: true

      - name: Final verification
        run: |
          echo "=== DEX URL check ==="
          unzip -p /tmp/NovaBoost.aab base/dex/classes.dex | strings | grep "surge" || echo "URL not found in classes.dex"
          echo ""
          echo "=== AAB full structure ==="
          unzip -l /tmp/NovaBoost.aab | tail -5
          echo ""
          echo "=== Total files in AAB ==="
          unzip -l /tmp/NovaBoost.aab | grep -c "base/"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-AAB-v2
          path: /tmp/NovaBoost.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-APK-v2
          path: /tmp/NovaBoost_aligned.apk
          retention-days: 30
