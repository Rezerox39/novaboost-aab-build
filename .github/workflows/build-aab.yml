name: Build NovaBoost AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set SDK tools path
        run: |
          SDK_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 -type d | sort -V | tail -1)
          echo "SDK_TOOLS=$SDK_TOOLS" >> $GITHUB_ENV
          echo "Using build-tools: $SDK_TOOLS"
          echo "$SDK_TOOLS" >> $GITHUB_PATH

      - name: Install apktool
        run: |
          curl -sL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.9.3.jar -o /usr/local/bin/apktool.jar
          echo '#!/bin/bash
          java -jar /usr/local/bin/apktool.jar "$@"' > /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Build APK with apktool
        run: |
          cd app-source
          rm -rf build
          find . -name "*.bak" -delete
          apktool b . -f -o /tmp/NovaBoost_raw.apk --use-aapt2
          echo "APK built: $(ls -la /tmp/NovaBoost_raw.apk)"

      - name: Zipalign and Sign APK
        run: |
          $SDK_TOOLS/zipalign -f 4 /tmp/NovaBoost_raw.apk /tmp/NovaBoost_aligned.apk
          echo "APK aligned"
          
          $SDK_TOOLS/apksigner sign \
            --ks novaboost_upload.keystore \
            --ks-pass pass:novaboost123 \
            --key-pass pass:novaboost123 \
            --ks-key-alias novaboost-upload \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            /tmp/NovaBoost_aligned.apk
          echo "APK signed: $(ls -la /tmp/NovaBoost_aligned.apk)"

      - name: Convert APK to AAB (bundletool, same as AAB Installer)
        run: |
          set -e
          rm -rf /tmp/bundle /tmp/aab-extra
          mkdir -p /tmp/bundle /tmp/aab-extra

          # 1. Convert APK resources to protobuf format (same as AAB Installer)
          $SDK_TOOLS/aapt2 convert --output-format proto \
            /tmp/NovaBoost_aligned.apk -o /tmp/bundle/proto.zip
          echo "proto.zip: $(ls -la /tmp/bundle/proto.zip | awk '{print $5}') bytes"

          # 2. Assemble the base module zip with the exact same layout
          #    that AAB Installer uses (manifest/, dex/, res/, lib/,
          #    assets/, resources.pb, root/; signature files dropped)
          python3 - << 'PY'
          import zipfile
          zin = zipfile.ZipFile('/tmp/bundle/proto.zip')
          zout = zipfile.ZipFile('/tmp/bundle/base.zip', 'w', zipfile.ZIP_DEFLATED)
          for info in zin.infolist():
              if info.is_dir():
                  continue
              name = info.filename
              if name.endswith('.dex') and name.startswith('classes'):
                  newname = 'dex/' + name
              elif name == 'AndroidManifest.xml':
                  newname = 'manifest/' + name
              elif (name.startswith('res/') or name.startswith('lib/')
                    or name == 'resources.pb' or name.startswith('assets/')):
                  newname = name
              elif name.endswith('.RSA') or name.endswith('.SF') or name.endswith('.MF'):
                  continue
              else:
                  newname = 'root/' + name
              zi = zipfile.ZipInfo(newname, (2026, 1, 1, 0, 0, 0))
              zi.compress_type = zipfile.ZIP_DEFLATED
              zout.writestr(zi, zin.read(info.filename))
          zout.close()
          zin.close()
          print("base.zip entries:", len(zipfile.ZipFile('/tmp/bundle/base.zip').namelist()))
          PY

          # 3. Build the AAB with bundletool
          if [ ! -f /tmp/bundle/bundletool.jar ]; then
            curl -sL -o /tmp/bundle/bundletool.jar \
              https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          fi
          java -jar /tmp/bundle/bundletool.jar build-bundle \
            --modules=/tmp/bundle/base.zip \
            --output=/tmp/bundle/non-signed.aab \
            --overwrite
          echo "AAB built: $(ls -la /tmp/bundle/non-signed.aab | awk '{print $5}') bytes"

          # 4. Embed ProGuard deobfuscation mapping so Google Play can
          #    deobfuscate crash/ANR reports for the obfuscated classes
          mkdir -p /tmp/aab-extra/BUNDLE-METADATA/com.android.tools.build.proguard
          cp proguard.map /tmp/aab-extra/BUNDLE-METADATA/com.android.tools.build.proguard/proguard.map
          (cd /tmp/aab-extra && zip -r -X /tmp/bundle/non-signed.aab BUNDLE-METADATA)
          echo "Deobfuscation mapping embedded: $(wc -l < proguard.map) lines"

          # 5. Verify structure
          echo "=== AAB Structure ==="
          unzip -l /tmp/bundle/non-signed.aab | grep -E "base/manifest|base/dex|base/resources.pb|base/assets.pb|BUNDLE-METADATA" | head -10

      - name: Sign AAB (Play-accepted test key, same as AAB Installer)
        run: |
          $SDK_TOOLS/apksigner sign \
            --ks aab-upload.keystore \
            --ks-pass pass:release \
            --key-pass pass:release \
            --ks-key-alias keystore \
            --min-sdk-version 23 \
            --out /tmp/NovaBoost.aab \
            /tmp/bundle/non-signed.aab
          echo "AAB signed: $(ls -la /tmp/NovaBoost.aab)"
          echo "Signing certificate:"
          unzip -p /tmp/NovaBoost.aab META-INF/KEYSTORE.RSA > /tmp/ks.rsa
          keytool -printcert -file /tmp/ks.rsa | grep -E "SHA1|SHA256|Owner" || true


      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "NovaBoost v2.3.1"
          body: |
            ## NovaBoost v2.3.1 — Pure AMOLED Background
            
            ### What's New
            - **Pure AMOLED black background** restored (true #000000) across all
              screens - deep blacks now, matching the neon green accents
            - Dark neon cyberpunk design system retained:
              - Dark charcoal surfaces (#181A20) with 16dp rounded cards
              - Electric neon green accent (#22E548) with green gradient buttons
                (#30F055 → #18B832)
              - Muted silver-grey secondary text (#8C93A0) and red danger accent
            - **Dashboard**: new System Monitor card (real storage dial + real
              ping badge, CPU/GPU activity readouts), full-width "BOOST NOW"
              gradient button, and redesigned tools grid (ULTRA BOOST, GFX
              TOOLS, NICK NAME)
            - **Floating bottom navigation pill** with 4 tabs: Dashboard,
              Tools, Games, Setting - active tab highlighted with neon pill
            - **Ultra Boost screen**: 100% hero gauge, boost-sequence checklist
              card, Game Mode + Do Not Disturb toggles, and a real "BOOST
              AGAIN" button that toggles the Ultra Boost profile
            - **Game Library**: GAME LIBRARY header, search field, + ADD NEW
              GAME button, and a styled game list
            - Keeps every real feature: live ping, real storage stats, boost &
              launch game launcher, kill background processes, DND, Game Mode
            
            ### Notes
            - Zero data collection - no analytics, no tracking, no ads
            - Google Play compliant (targets Android 16 / API 36)
          files: |
            /tmp/NovaBoost.aab
            /tmp/NovaBoost_aligned.apk
          generate_release_notes: false
          make_latest: true

      - name: Final verification
        run: |
          echo "=== DEX URL check ==="
          unzip -p /tmp/NovaBoost.aab base/dex/classes.dex | strings | grep "surge" || echo "URL not found in classes.dex"
          echo ""
          echo "=== AAB full structure ==="
          unzip -l /tmp/NovaBoost.aab | tail -5
          echo ""
          echo "=== Total files in AAB ==="
          unzip -l /tmp/NovaBoost.aab | grep -c "base/"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-AAB-v2
          path: /tmp/NovaBoost.aab
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaBoost-APK-v2
          path: /tmp/NovaBoost_aligned.apk
          retention-days: 30
